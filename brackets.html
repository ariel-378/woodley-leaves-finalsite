<script>
(function () {
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Our own team, highlighted in the bracket. Comes from config (homeTeam) so
  // this page is generic; it must match the team's name in the bracket data.
  function homeTeam() {
    const cfg = window.WLBrand ? WLBrand.get() : (window.WL_CONFIG || {});
    return cfg.homeTeam || "Home";
  }

  function matchHtml(m) {
    const home = homeTeam();
    const t1 = m.result && m.result.winner === m.team1;
    const t2 = m.result && m.result.winner === m.team2;
    const scheduled = (!m.result && m.scheduled) ? `<div class="bracket-scheduled">${escapeHtml(m.scheduled)}</div>` : "";
    return `
      <div class="bracket-match ${m.result ? "settled" : "pending"}">
        <div class="bracket-team ${t1 ? "won" : (m.result ? "lost" : "")} ${m.team1 === home ? "home-team" : ""}">
          <span>${escapeHtml(m.team1)}</span>
        </div>
        <div class="bracket-team ${t2 ? "won" : (m.result ? "lost" : "")} ${m.team2 === home ? "home-team" : ""}">
          <span>${escapeHtml(m.team2)}</span>
        </div>
        ${m.result ? `<div class="bracket-result">Final: ${escapeHtml(m.result.winner)} ${escapeHtml(m.result.score)}</div>` : scheduled}
      </div>
    `;
  }

  function render() {
    const container = document.getElementById("brackets-container");
    container.innerHTML = "";

    if (window.WLTeams && !WLTeams.blockEnabled("brackets")) {
      container.innerHTML = `<p class="search-empty">Playoff brackets are currently turned off.</p>`;
      return;
    }

    const brackets = WLTeams.getAllBrackets();

    if (Object.keys(brackets).length === 0) {
      container.innerHTML = `<p class="search-empty">No active tournaments. Check back during playoff season.</p>`;
      return;
    }

    Object.entries(brackets).forEach(([slug, b]) => {
      const section = document.createElement("section");
      section.className = "bracket-section";
      const roundsHtml = b.rounds.map(r => `
        <div class="bracket-round">
          <div class="bracket-round-title">${escapeHtml(r.name)}</div>
          <div class="bracket-matches">
            ${r.matches.map(matchHtml).join("")}
          </div>
        </div>
      `).join("");
      section.innerHTML = `
        <h3 class="bracket-title">${escapeHtml(b.title)}</h3>
        <div class="bracket-meta">${escapeHtml(b.sport)} · ${escapeHtml(b.season)}</div>
        <div class="bracket-tree">${roundsHtml}</div>
      `;
      container.appendChild(section);
    });
  }

  render();
  document.addEventListener("wl-teams-change", render);
})();
</script>
