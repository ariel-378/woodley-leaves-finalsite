<style>
  .staff-intro {
    max-width: 620px;
    font-size: 16px;
    line-height: 1.6;
    color: #333;
    margin: 0 0 36px;
  }

  .staff-section {
    margin-bottom: 44px;
  }
  .staff-section h3 {
    font-family: Georgia, serif;
    font-size: 22px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
    margin: 0 0 20px;
  }

  .staff-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 26px;
  }

  .staff-card {
    display: flex;
    flex-direction: column;
  }
  .staff-photo {
    background: #ece8df;
    aspect-ratio: 1 / 1;
    margin-bottom: 12px;
    border-radius: 50%;
    max-width: 140px;
    width: 100%;
  }
  img.staff-photo { object-fit: cover; }
  .staff-card h4 {
    font-family: Georgia, serif;
    font-size: 18px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  .staff-card .staff-role {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 2px;
  }
  .staff-card .staff-year {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .staff-card a {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--ink);
  }

  .staff-empty {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 16px 18px;
    background: var(--cream);
  }
</style>
<link rel="stylesheet" href="responsive.css" />
</head>
<body>

<script src="staff-data.js"></script>

<script src="submissions.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="text-editor.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function cardHtml(m) {
    const photo = m.photo
      ? `<img class="staff-photo" src="${esc(m.photo)}" alt="${esc(m.name)}">`
      : `<div class="staff-photo"></div>`;
    const name = m.slug
      ? `<a href="writer.html?slug=${encodeURIComponent(m.slug)}">${esc(m.name)}</a>`
      : esc(m.name);
    return `<div class="staff-card">
      ${photo}
      <h4>${name}</h4>
      ${m.role ? `<p class="staff-role">${esc(m.role)}</p>` : ""}
      ${m.year ? `<p class="staff-year">${esc(m.year)}</p>` : ""}
      ${m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : ""}
    </div>`;
  }
  function render() {
    const root = document.getElementById("staff-root");
    if (!root || !window.WLStaff) return;
    const all = WLStaff.getAll();
    if (all.length === 0) {
      root.innerHTML = `<p class="staff-empty">No staff listed yet.</p>`;
      return;
    }
    root.innerHTML = WLStaff.orderedGroups().map(g => {
      const members = all.filter(m => m.group === g);
      if (!members.length) return "";
      return `<section class="staff-section">
        <h3>${esc(g)}</h3>
        <div class="staff-grid">${members.map(cardHtml).join("")}</div>
      </section>`;
    }).join("");
  }
  document.addEventListener("DOMContentLoaded", render);
  document.addEventListener("wl-staff-change", render);
})();
</script>
</body>
</html>
