<script src="articles.js"></script>

<script src="script.js"></script>
<script src="text-editor.js"></script>
<script>
(function () {
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const params = new URLSearchParams(location.search);
  const tag = (params.get("tag") || "").toLowerCase().trim();

  const all = WLArticles.getAll();
  const entries = Object.entries(all).map(([id, a]) => ({ id, ...a })).filter(a => WLArticles.isVisible(a));

  // Collect all tags for the cloud
  const tagCounts = {};
  entries.forEach(a => (a.tags || []).forEach(t => {
    const key = t.toLowerCase();
    tagCounts[key] = (tagCounts[key] || 0) + 1;
  }));

  const cloud = document.getElementById("tag-cloud");
  const tags = Object.keys(tagCounts).sort();
  cloud.innerHTML = tags.length
    ? tags.map(t => `<a class="tag-chip" href="tag.html?tag=${encodeURIComponent(t)}">${escapeHtml(t)} <span class="tag-count">${tagCounts[t]}</span></a>`).join("")
    : `<p style="font-size:14px; color: var(--muted); font-style: italic;">No tags have been added yet. Editors can add tags to any article from the dashboard.</p>`;

  if (!tag) {
    document.getElementById("tag-heading").textContent = "All tags";
    document.getElementById("tag-summary").textContent = "";
    document.getElementById("tag-results").innerHTML = `<p class="search-empty">Pick a tag below to see its articles.</p>`;
    return;
  }

  // Filter articles by tag
  const matches = entries
    .filter(a => (a.tags || []).some(t => t.toLowerCase() === tag))
    .sort((x, y) => (Date.parse(y.date) || 0) - (Date.parse(x.date) || 0));

  document.getElementById("tag-heading").textContent = `#${tag}`;
  document.getElementById("tag-summary").textContent = `${matches.length} article${matches.length === 1 ? "" : "s"}`;
  document.title = `#${tag} — The Student Times`;

  const results = document.getElementById("tag-results");
  if (matches.length === 0) {
    results.innerHTML = `<p class="search-empty">No articles tagged with "${escapeHtml(tag)}" yet.</p>`;
    return;
  }
  results.innerHTML = matches.map(a => `
    <article class="search-result">
      <div class="kicker">${escapeHtml(a.section)}</div>
      <h3><a href="article.html?id=${encodeURIComponent(a.id)}">${escapeHtml(a.title)}</a></h3>
      <p>${escapeHtml(a.deck)}</p>
      <div class="byline">By ${escapeHtml(a.byline)} · ${escapeHtml(a.date)}</div>
    </article>
  `).join("");
})();
</script>
</body>
</html>
