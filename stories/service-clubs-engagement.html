<script>
(function () {
  const params = new URLSearchParams(location.search);
  // No fallback id: this page renders whatever ?id= names. Defaulting to one
  // article meant a bare /article.html silently served that story forever, and
  // pinned a demo slug into the page for good.
  // A generated story page (stories/<id>.html) bakes its id in, so the URL
  // needs no query string and a crawler sees real og: tags. ?id= still works
  // for older links and for the editor's preview.
  const id = window.WL_ARTICLE_ID || params.get("id") || "";

  const a = WLArticles.getById(id);

  if (!a) {
    document.getElementById("article-not-found").style.display = "block";
    document.title = "Article not found — The Student Times";
    return;
  }

  // Scheduled articles, and articles in a hidden section, stay off the public
  // site. Editors (in preview) can still open them, shown with a banner.
  const isLive = !WLArticles.isVisible || WLArticles.isVisible(a);
  const canPreview = !!(window.WLAuth && WLAuth.isEditor && WLAuth.isEditor());
  if (!isLive && !canPreview) {
    document.getElementById("article-not-found").style.display = "block";
    document.title = "Article not found — The Student Times";
    return;
  }
  if (!isLive) {
    const scheduled = WLArticles.isPublished && !WLArticles.isPublished(a);
    const banner = document.createElement("div");
    banner.className = "schedule-banner";
    banner.textContent = scheduled
      ? "\u23F3 Scheduled — not public yet. Editors can preview; goes live " + new Date(a.publishAt).toLocaleString() + "."
      : "\u23F3 This section is hidden from readers. Editors can preview it here.";
    const root = document.getElementById("article-root");
    if (root) root.insertBefore(banner, root.firstChild);
  }

  // Record a page view for the trending widget (localStorage, per-browser)
  if (window.WLViews) WLViews.record(id);

  // Render
  document.getElementById("article-body").style.display = "block";
  document.title = `${a.title} — The Student Times`;
  // Update the meta tags for sharing.
  //
  // No social crawler runs JavaScript, so this can never be what makes a link
  // preview correct — that is why every story is also written out as a real
  // page under stories/ with these values already in the markup. See
  // setup/build-stories.mjs.
  //
  // This still runs, for two reasons: on stories/<id>.html it rewrites the tags
  // to the values already there, which is harmless; and on this page reached as
  // article.html?id=... — an old link, or the editor previewing a draft that has
  // no generated page yet — it is the only thing setting them, which the
  // browser's own share sheet does read.
  const absoluteUrl = location.href.split("#")[0];
  const photoUrl = a.photo ? (a.photo.startsWith("http") ? a.photo : new URL(a.photo, location.href).href) : "";
  const setMeta = (selector, value) => {
    const el = document.querySelector(selector);
    if (el) el.setAttribute("content", value);
  };
  setMeta('meta[name="description"]', a.deck || "");
  setMeta('meta[property="og:title"]', a.title);
  setMeta('meta[property="og:description"]', a.deck || "");
  setMeta('meta[property="og:image"]', photoUrl);
  setMeta('meta[name="twitter:title"]', a.title);
  setMeta('meta[name="twitter:description"]', a.deck || "");
  setMeta('meta[name="twitter:image"]', photoUrl);

  document.getElementById("art-kicker").textContent = a.section;
  document.getElementById("art-title").textContent = a.title;
  document.getElementById("art-deck").textContent = a.deck;
  const roleStr = a.role ? ` · ${a.role}` : "";
  // Reading time estimate — 200 words per minute, minimum 1 minute.
  const wordCount = (a.body || []).join(" ").trim().split(/\s+/).filter(Boolean).length;
  const readMin = Math.max(1, Math.round(wordCount / 200));
  // Link byline to writer profile if we have one (or could have one — we still
  // link any real-name byline so readers can see all of a writer's articles).
  // Each author is a separate linked tag (never joined with "and").
  const bylineEl = document.getElementById("art-byline");
  const bylineTags = window.WL_bylineTagsHtml ? WL_bylineTagsHtml(a) : escapeHtml(a.byline || "");
  bylineEl.innerHTML = "By " + bylineTags +
    '<span class="byline-meta">' + escapeHtml(roleStr) + " · " + escapeHtml(a.date) + " · " + readMin + " min read</span>";

  // Render media (video first, then photo, then default placeholder)
  const mediaEl = document.getElementById("art-media");
  const captionEl = document.getElementById("art-caption");
  function parseVideo(url) {
    if (!url) return null;
    const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]+)/);
    if (yt) return { type: "youtube", id: yt[1] };
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if (vm) return { type: "vimeo", id: vm[1] };
    return null;
  }
  if (a.video) {
    const v = parseVideo(a.video);
    if (v && v.type === "youtube") {
      mediaEl.innerHTML = `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${v.id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    } else if (v && v.type === "vimeo") {
      mediaEl.innerHTML = `<div class="video-embed"><iframe src="https://player.vimeo.com/video/${v.id}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
    } else {
      mediaEl.innerHTML = `<div class="caption" style="color:#b8002a;">Couldn't recognize the video URL. Use a YouTube or Vimeo link.</div>`;
    }
    captionEl.textContent = a.photoCaption || "";
  } else if (a.photo) {
    const img = document.createElement("img");
    img.className = "article-photo";
    img.src = a.photo;
    img.alt = a.title;
    mediaEl.appendChild(img);
    captionEl.textContent = a.photoCaption || "";
  } else {
    mediaEl.innerHTML = `<div class="photo wide"></div>`;
    captionEl.textContent = "";
  }

  const proseEl = document.getElementById("art-prose");
  proseEl.innerHTML = "";
  a.body.forEach(para => {
    const p = document.createElement("p");
    p.textContent = para;
    proseEl.appendChild(p);
  });

  // Gallery (optional)
  if (Array.isArray(a.gallery) && a.gallery.length > 0) {
    const wrap = document.getElementById("art-gallery");
    const grid = document.getElementById("gallery-grid");
    wrap.hidden = false;
    grid.innerHTML = a.gallery.map((g, i) => `
      <button class="gallery-thumb" data-i="${i}" aria-label="Open photo ${i + 1}">
        <img src="${g.url}" alt="${(g.caption || "Photo " + (i + 1)).replace(/"/g, "&quot;")}" loading="lazy">
      </button>
    `).join("");

    // Lightbox
    const overlay = document.createElement("div");
    overlay.className = "lightbox-overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.setAttribute("aria-label", "Photo viewer");
    overlay.innerHTML = `
      <button class="lb-close" aria-label="Close photo">×</button>
      <button class="lb-prev" aria-label="Previous photo">‹</button>
      <button class="lb-next" aria-label="Next photo">›</button>
      <img class="lb-img" alt="">
      <div class="lb-caption"></div>
      <div class="lb-count"></div>
    `;
    document.body.appendChild(overlay);

    let current = 0;
    const imgEl = overlay.querySelector(".lb-img");
    const capEl = overlay.querySelector(".lb-caption");
    const cntEl = overlay.querySelector(".lb-count");
    function show(idx) {
      current = (idx + a.gallery.length) % a.gallery.length;
      imgEl.src = a.gallery[current].url;
      imgEl.alt = a.gallery[current].caption || `Photo ${current + 1}`;
      capEl.textContent = a.gallery[current].caption || "";
      cntEl.textContent = `${current + 1} / ${a.gallery.length}`;
    }
    // The overlay covers the page, so focus must go into it and stay there.
    // Without this, Tab walked onto links hidden behind the backdrop and the
    // focus ring vanished from view.
    let lastFocused = null;
    function open(i) {
      lastFocused = document.activeElement;
      show(i);
      overlay.classList.add("visible");
      overlay.querySelector(".lb-close").focus();
    }
    function close() {
      overlay.classList.remove("visible");
      if (lastFocused && lastFocused.focus) lastFocused.focus();
      lastFocused = null;
    }
    grid.querySelectorAll(".gallery-thumb").forEach(b => b.addEventListener("click", () => open(+b.dataset.i)));
    overlay.querySelector(".lb-close").addEventListener("click", close);
    overlay.querySelector(".lb-prev").addEventListener("click", () => show(current - 1));
    overlay.querySelector(".lb-next").addEventListener("click", () => show(current + 1));
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
    document.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("visible")) return;
      if (e.key === "Escape") { close(); return; }
      if (e.key === "ArrowLeft") { show(current - 1); return; }
      if (e.key === "ArrowRight") { show(current + 1); return; }
      if (e.key !== "Tab") return;
      const items = [...overlay.querySelectorAll("button")].filter(b => b.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  // Highlight this article's section in the (dynamically built) nav.
  if (window.WLNav) WLNav.setActive(a.section);

  // Share buttons
  const url = location.href;
  const copyBtn = document.querySelector('.share-btn[data-action="copy"]');
  copyBtn.addEventListener("click", async (e) => {
    try {
      await navigator.clipboard.writeText(url);
      e.target.textContent = "Copied!";
      setTimeout(() => { e.target.textContent = "Copy link"; }, 1500);
    } catch {
      e.target.textContent = "Press Cmd/Ctrl+C";
    }
  });


  // Tags. WLTags decides what a reader sees: nothing at all when the paper has
  // tags switched off, and only tags still on the editors' list otherwise — so
  // a removed tag stops appearing without having to be scrubbed from every
  // article that carried it.
  const shownTags = window.WLTags ? WLTags.visibleFor(a) : (Array.isArray(a.tags) ? a.tags : []);
  if (shownTags.length > 0) {
    const tagsEl = document.getElementById("article-tags");
    tagsEl.hidden = false;
    tagsEl.innerHTML = shownTags.map(t =>
      `<a class="tag-chip" href="${WL_rootHref(`tag.html?tag=${encodeURIComponent(t.toLowerCase())}`)}">${t.replace(/[<>&"]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]))}</a>`
    ).join("");
  }

  // Related articles — same section, excluding current, newest first, max 3.
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const all = WLArticles.getAll();
  const related = Object.entries(all)
    .filter(([otherId, art]) => otherId !== id && art.section === a.section && WLArticles.isVisible(art))
    .map(([otherId, art]) => ({ id: otherId, ...art }))
    .sort((x, y) => (Date.parse(y.date) || 0) - (Date.parse(x.date) || 0))
    .slice(0, 3);
  if (related.length > 0) {
    const section = document.getElementById("related-articles");
    const grid = document.getElementById("related-grid");
    section.hidden = false;
    grid.innerHTML = related.map(r => `
      <a class="related-card" href="${WL_storyHref(r.id)}">
        <div class="kicker">${escapeHtml(r.section)}</div>
        <h4>${escapeHtml(r.title)}</h4>
        <p>${escapeHtml(r.deck)}</p>
        <div class="byline">By ${escapeHtml((window.WL_articleAuthors && window.WL_bylineText) ? WL_bylineText(WL_articleAuthors(r)) : (r.byline || ""))} · ${escapeHtml(r.date)}</div>
      </a>
    `).join("");
  }

})();
</script>
