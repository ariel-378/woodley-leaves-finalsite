<footer></footer>

<script src="videos.js"></script>
<script src="videos-store.js"></script>
<script src="submissions.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="text-editor.js"></script>
<script>
(function () {
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function thumb(v) {
    const info = WLVideos.parseVideo(v.url);
    if (info && info.type === "youtube") {
      return `<img src="https://img.youtube.com/vi/${info.id}/hqdefault.jpg" alt="${escapeHtml(v.title)}" loading="lazy">`;
    }
    return `<div class="video-placeholder"></div>`;
  }

  function videoCard(v) {
    return `
      <a class="video-card" href="video.html?id=${encodeURIComponent(v.id)}">
        <div class="video-thumb">
          ${thumb(v)}
          <span class="video-play" aria-hidden="true">▶</span>
          ${v.duration ? `<span class="video-duration">${escapeHtml(v.duration)}</span>` : ""}
        </div>
        <div class="video-body">
          <h4>${escapeHtml(v.title)}</h4>
          <div class="byline">By ${escapeHtml(v.byline)} · ${escapeHtml(v.date)}</div>
        </div>
      </a>
    `;
  }

  function render() {
    const videos = Object.entries(WLVideos.getAll())
      .map(([id, v]) => ({ id, ...v }))
      .sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
    document.getElementById("interviews-grid").innerHTML = videos.map(videoCard).join("");
    document.getElementById("videos-empty").hidden = videos.length > 0;
  }

  document.addEventListener("wl-videos-change", render);
  render();
})();
</script>
</body>
</html>
