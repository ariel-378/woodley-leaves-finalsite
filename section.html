<!-- Resolve the section from ?name= before the renderers run. Runs synchronously
     during parse, so section.js/nav.js see the values on DOMContentLoaded. -->
<script src="sections-store.js"></script>
<script>
  (function () {
    const name = new URLSearchParams(location.search).get("name") || "";
    const known = window.WLSections && WLSections.find(name);
    const list = document.getElementById("article-list");
    const titleEl = document.getElementById("section-title");
    const kickerEl = document.getElementById("section-kicker");
    const datelineEl = document.getElementById("section-dateline");
    const groupEl = document.getElementById("section-main");

    // A slug of the section name namespaces this page's editable text and its
    // saved layout. Both are keyed by page, and every editor-created section
    // shares section.html — without the slug, renaming a kicker or reordering
    // one section's modules would change every other section too.
    function slugify(s) {
      return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    if (name && known) {
      const slug = slugify(name) || "section";
      document.title = name + " — The Student Times";
      titleEl.textContent = name;
      list.dataset.section = name;

      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute("content", name + " — The Student Times");

      // Parity with the built-in section pages (news.html and friends): the
      // kicker and dateline are inline-editable, and the article list is a
      // movable block. Set before text-editor.js and layout-editor.js run.
      document.body.dataset.layoutPage = "section-" + slug;
      kickerEl.dataset.wlText = "section-" + slug + "-kicker";
      datelineEl.dataset.wlText = "section-" + slug + "-dateline";
      groupEl.dataset.moveGroup = "section-" + slug + "-main";
      list.dataset.moveKey = "articles";
      list.dataset.moveLabel = "Articles";
    } else {
      titleEl.textContent = name ? "Section not found" : "Section";
      kickerEl.textContent = "Section";
      list.innerHTML = '<p class="section-empty">That section doesn’t exist. <a href="index.html">Back to the front page.</a></p>';
    }
  })();
</script>
