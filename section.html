<!-- Resolve the section from ?name= before the renderers run. Runs synchronously
     during parse, so section.js/nav.js see the values on DOMContentLoaded. -->
<script src="sections-store.js"></script>
<script>
  (function () {
    const name = new URLSearchParams(location.search).get("name") || "";
    const known = window.WLSections && WLSections.find(name);
    const list = document.getElementById("article-list");
    const titleEl = document.getElementById("section-title");
    if (name && known) {
      document.title = name + " — The Student Times";
      titleEl.textContent = name;
      list.dataset.section = name;
    } else {
      titleEl.textContent = name ? "Section not found" : "Section";
      list.innerHTML = '<p class="section-empty">That section doesn’t exist. <a href="index.html">Back to the front page.</a></p>';
    }
  })();
</script>
